# Pantegnos Android build configuration
#
# Values here are intentionally conservative: the release build has to be
# reproducible on a stock GitHub Actions runner with no extra setup.

org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official
kotlin.incremental=true
